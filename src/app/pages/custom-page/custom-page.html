<section class="m-5">
  <h1 class="text-2xl font-bold">Pipes custom</h1>
  <h3 class="text-xl font-thin">Pipes not includes in Angular</h3>
</section>
<div class="stats stats-vertical lg:stats-horizontal shadow">
  <div class="stats shadow">
    <div class="stat">
      <div class="stat-title">ToggleCase Pipe</div>
      <div class="stat-value">{{ name() | toggleCase: uppercase() }}</div>
      <div class="stat-desc">{{ name() }}</div>
      <button class="btn btn-primary" (click)="uppercase.set(!uppercase())">Toggle Case</button>
    </div>
  </div>
</div>
